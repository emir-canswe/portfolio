<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#4169E1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Navy Background -->
  <rect width="128" height="128" rx="28" fill="#0B0F1A" stroke="url(#hudGrad)" stroke-width="5" />
  
  <!-- Corner HUD brackets -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#00F2FF" stroke-width="3" stroke-linecap="round" />
  <path d="M 92 112 L 112 112 L 112 92" fill="none" stroke="#00F2FF" stroke-width="3" stroke-linecap="round" />
  
  <!-- Glowing Monogram EC -->
  <text x="64" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-weight="900" font-size="52" fill="#00F2FF" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">EC</text>
  
  <!-- Active System Telemetry Dot -->
  <circle cx="106" cy="22" r="7" fill="#10B981" />
</svg>
